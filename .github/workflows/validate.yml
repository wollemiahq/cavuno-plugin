name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check JSON manifests parse
        run: |
          for file in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json .cursor-plugin/plugin.json \
            .grok-plugin/plugin.json .mcp.json mcp.json plugin.json; do
            python3 -m json.tool "$file" > /dev/null
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      # Directory listing fields (icon, privacyPolicyUrl, …) validate cleanly
      # from Claude Code 2.1.281.
      - name: Validate the Claude plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.293 plugin validate --strict .claude-plugin/plugin.json

      - name: Check every skill has name and description front matter
        run: |
          for skill in skills/*/SKILL.md; do
            dir="$(basename "$(dirname "$skill")")"
            head -1 "$skill" | grep -qx -- '---'
            grep -qx "name: ${dir}" "$skill"
            grep -q '^description: ' "$skill"
          done
